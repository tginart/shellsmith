[compute]
backend = "mlx"
host = "user@studio-host"  # SSH user@host or ~/.ssh/config alias
home = "~/.local/state/shellsmith"
python = "~/.local/share/shellsmith/studio-v1/env/bin/python"
gpu_lease_root = "~/.local/state/shellsmith/gpu-lease"

[run]
run_id = "mlx-studio-canary"

[mlx]
profile = "qwen38_dense_8bit_32k"
model_id = "Qwen/Qwen3.8-27B"
model_path = "~/models/Qwen3.8-27B-8bit"
quantization_bits = 8
quantization_group_size = 64
lora_rank = 16
lora_scale = 2.0
lora_layers = -1
context_window = 32768
max_tokens = 8192
thinking_tokens = 4096
response_tokens = 4096
plain_tokens = 4096
compaction_tokens = 2048
compaction_reserve_tokens = 12288
compaction_keep_recent_tokens = 8192

[player]
temperature = 1.0
top_p = 1.0
pi_sdk_module_path = "~/.local/share/shellsmith/studio-v1/tools/node_modules/@earendil-works/pi-coding-agent/dist/index.js"

[worlds]
select = "ids"
ids = ["checkout_idempotency_001"]

[gm]
runtime = "codex"
provider = "codex-cli"
model = "gpt-6.1-sol"
reasoning_effort = "low"
max_world_steps = 20

[train]
steps = 1
groups_per_update = 1
learning_rate = 0.00005
cispo_clip_low = 0.0
cispo_clip_high = 4.0
kl_penalty_coef = 0.0
checkpoint_every = 1

[adaptive]
initial_attempts = 4
maximum_attempts = 8
minimum_trainable = 4
minimum_reward_range = 0.15
low_spread_top_up = 4
parallelism = 1
parallelism_per_provider = 1
provider_outage = "halt"
